name: 浙江完整版：确认今天生成（消耗API额度）
on:
  workflow_dispatch:
    inputs:
      confirm_today:
        description: '确认今天使用API额度生成新内容（不勾选只检查，零模型调用）'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    # Deployment checks are free of model calls: only manual confirmation can generate.
    paths: ['.github/workflows/full-daily-content.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: published-study-content
  cancel-in-progress: false
jobs:
  update:
    # No schedule. Owner must explicitly confirm today's paid generation.
    # AUTO_CONTENT_ENABLED=false remains an emergency pause; forks are excluded.
    if: github.repository == 'sudubin/gongkaozhinan' && github.ref == 'refs/heads/main' && vars.AUTO_CONTENT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: 验证当天确认（不调用模型）
        id: approval
        uses: actions/github-script@v8
        env:
          CONFIRM_TODAY: ${{ inputs.confirm_today == true && 'true' || 'false' }}
        with:
          script: |
            core.setOutput('approved', 'false');
            core.setOutput('day', '');
            const day = value => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(value));
            if (context.eventName !== 'workflow_dispatch' || process.env.CONFIRM_TODAY !== 'true') {
              await core.summary.addHeading('本次仅检查已有内容').addRaw('未确认今天生成，不调用模型API、不修改内容和额度记录。').write();
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const approvedDay = day(run.created_at);
            if (run.event !== 'workflow_dispatch' || approvedDay !== day(Date.now())) {
              await core.summary.addHeading('当天确认已过期').addRaw('旧任务跨天重跑不消耗API额度；如需生成，请重新点击Run workflow并勾选今天确认。').write();
              return;
            }
            core.setOutput('approved', 'true');
            core.setOutput('day', approvedDay);
            await core.summary.addHeading('已确认当天生成').addRaw('仅本次当日运行可生成，仍保留当天累计数量和请求上限；不自动授权明天。').write();
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:packages
      - name: Verify preservation, integrity and API cost guards
        run: node --test scripts/full-content/content.test.mjs
      - name: 验证未确认时零模型调用
        run: node scripts/full-content/update-content.mjs
      - name: 生成并发布今天内容（消耗API额度）
        if: steps.approval.outputs.approved == 'true'
        env:
          FULL_GENERATION_CONFIRMED: 'true'
          FULL_GENERATION_DAY: ${{ steps.approval.outputs.day }}
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          CONTENT_API_BASE_URL: ${{ secrets.CONTENT_API_BASE_URL }}
          CONTENT_MODEL: ${{ secrets.CONTENT_MODEL }}
          CONTENT_DAILY_PER_MODULE: '5'
          FULL_CONTENT_DIRECTORY: public/content/full
          FULL_GIT_CHECKPOINTS: 'true'
          NODE_OPTIONS: '--dns-result-order=ipv4first'
        run: node scripts/full-content/update-content.mjs
      - name: Verify published full-version package
        if: always()
        run: |
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {verifiedPackage} from "./scripts/full-content/content-package.mjs"; const p=verifiedPackage(JSON.parse(await readFile("public/content/full/latest.json","utf8"))); console.log(JSON.stringify({releaseId:p.releaseId,cards:p.items.length,questions:p.questions.length}));'
      - name: Retain public data for troubleshooting (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-version-public-content
          path: |
            public/content/full/latest.json
            public/content/full/generation-state.json
          retention-days: 7
