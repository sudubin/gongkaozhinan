name: Legacy open-source content (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: published-study-content
  cancel-in-progress: false
jobs:
  update:
    # Preserved for maintenance; full-version deployment stops this daily job.
    if: github.repository == 'sudubin/gongkaozhinan' && vars.LEGACY_OPEN_SOURCE_CONTENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:packages
      - name: Generate checked incremental content
        id: generate
        env:
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          CONTENT_API_BASE_URL: ${{ secrets.CONTENT_API_BASE_URL }}
          CONTENT_MODEL: ${{ secrets.CONTENT_MODEL }}
          CONTENT_DAILY_PER_MODULE: ${{ vars.CONTENT_DAILY_PER_MODULE || '5' }}
        run: node scripts/update-content.mjs
      - name: Save completed batches, including after partial failure
        if: always() && steps.generate.outcome != 'skipped'
        run: |
          git config user.name 'gongkao-content-bot'
          git config user.email 'gongkao-content-bot@users.noreply.github.com'
          git add public/content/latest.json public/content/generation-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update checked study content'
            git push origin HEAD:main
          fi
